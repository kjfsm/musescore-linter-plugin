name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile --prefer-offline

      # 版は lockfile の @playwright/test が決める。test:e2e も同じ install を呼ぶが、
      # 共有ライブラリの apt-get（--with-deps）は root で回る CI でだけ行う。
      - name: Playwright のブラウザ
        run: pnpm --filter @score-linter/web exec playwright install --with-deps chromium

      # ゲートの正は package.json の verify（turbo のタスクグラフ）。手元でも同じコマンドを叩く。
      - name: 検証ゲート
        run: pnpm verify
