name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint / フォーマットチェック
        run: pnpm lint

      - name: 未使用コード検出
        run: pnpm knip

      - name: 型チェック
        run: pnpm typecheck

      - name: テスト (カバレッジ計測)
        run: pnpm test:coverage

      - name: ビルド
        run: pnpm build

      - name: Web のビルド
        run: pnpm build:web

      # 「アップロードしたファイルは送信されない」の実質的な検証。
      # 自前で書いたコード（エントリチャンク）にネットワーク API が現れた時点で主張が崩れるので CI で止める。
      # 動的 import で分離された vendor チャンク（例: opensheetmusicdisplay）は対象外にしている。
      # 中身を完全には制御できない第三者ライブラリのコードで、実行時の実質的な歯止めは
      # _headers の `connect-src 'none'`（fetch/XHR/WebSocket 等をブラウザレベルで禁止）に委ねる。
      - name: Web が通信コードを含まないことの確認
        run: |
          if grep -lE "fetch\(|XMLHttpRequest|WebSocket|sendBeacon|EventSource" apps/web/dist/assets/index-*.js; then
            echo "::error::apps/web のバンドルにネットワーク API が含まれています"
            exit 1
          fi
          if grep -qE "<script[^>]*>[^<]" apps/web/dist/index.html; then
            echo "::error::apps/web/dist/index.html にインライン script があります（CSP script-src 'self' に違反）"
            exit 1
          fi

      - name: Codecov へのカバレッジ送信
        if: always()
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
