name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint / フォーマットチェック
        run: pnpm lint

      - name: 未使用コード検出
        run: pnpm knip

      # turbo のタスクグラフ自体を検証する。未定義タスク名や依存の破綻は
      # ここで落ちる（個別に pnpm run を叩いていた頃はすり抜けていた）。
      - name: turbo タスクグラフの検証
        run: pnpm pipeline --dry=json > /dev/null

      # 型チェック・テスト・QML/CLI/Web のビルド・ZIP 化までを turbo 経由で通す。
      - name: パイプライン (typecheck / test / build / package)
        run: pnpm pipeline

      # codecov へ送る lcov は 1 本にまとめたいので、ルートの vitest で
      # 全パッケージを一度に計測する（turbo 側の test はパッケージ単位）。
      - name: カバレッジ計測
        run: pnpm test:coverage

      # 「アップロードしたファイルは送信されない」の実質的な検証。
      # ネットワーク API がバンドルに現れた時点で主張が崩れるので CI で止める。
      - name: Web が通信コードを含まないことの確認
        run: |
          if grep -lE "fetch\(|XMLHttpRequest|WebSocket|sendBeacon|EventSource" apps/web/dist/assets/*.js; then
            echo "::error::apps/web のバンドルにネットワーク API が含まれています"
            exit 1
          fi
          if grep -qE "<script[^>]*>[^<]" apps/web/dist/index.html; then
            echo "::error::apps/web/dist/index.html にインライン script があります（CSP script-src 'self' に違反）"
            exit 1
          fi

      # 閾値では落とさない（runner のブレが大きく偽陽性になる）。
      # job summary に数値を出すだけにして、回帰は PR 前後の比較で判断する。
      - name: 性能ベースラインの計測
        run: pnpm bench

      - name: Codecov へのカバレッジ送信
        if: always()
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
