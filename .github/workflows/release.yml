name: リリース

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # attest-build-provenance
  attestations: write

jobs:
  release:
    name: リリース
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node.js のセットアップ
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Playwright のブラウザ
        run: pnpm --filter @score-linter/web exec playwright install --with-deps chromium

      # 配る ZIP は、CI と同じゲートを通したこのビルドから作る（verify が build と package まで行う）
      - name: 検証ゲート
        run: pnpm verify

      - name: Changeset アクションの実行
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: "バージョンアップ"
          commit-message: "chore: バージョンアップ"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ZIP のビルド来歴の証明
        if: steps.changesets.outputs.has-changesets == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            apps/plugin/score-linter*.zip
            apps/plugin/musescore-linter-plugin.zip

      - name: GitHub Release の作成
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./apps/plugin/package.json').version")
          TAG="v${VERSION}"
          ZIP="apps/plugin/score-linter-${VERSION}.zip"
          LATEST_ZIP="apps/plugin/score-linter.zip"
          # 2.4.0 以前のプラグインは更新リンクにこの旧名を使う
          LEGACY_ZIP="apps/plugin/musescore-linter-plugin.zip"

          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "リリース ${TAG} は既に存在します。スキップします。"
            exit 0
          fi

          gh release create "${TAG}" "${ZIP}" "${LATEST_ZIP}" "${LEGACY_ZIP}" --title "${TAG}" --generate-notes
          echo "リリース ${TAG} を作成しました。"
