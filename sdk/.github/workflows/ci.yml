name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: publint
        run: pnpm publint

      - name: attw
        run: pnpm attw
        continue-on-error: true

  generated-types-drift:
    name: generated types drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate types from upstream
        run: pnpm generate:types
        env:
          # 固定された MuseScore タグのコミット SHA を解決する際、未認証の場合に課される
          # 60 リクエスト/時のレート制限を回避するために認証付きでリクエストする。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if generated output drifted
        run: git diff --exit-code -- packages/types/src/generated
